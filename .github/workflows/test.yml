name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Поставить зависимости
        run: npm ci

      - name: Поставить браузер для e2e
        run: npx playwright install --with-deps chromium

      - name: Прогнать тесты
        run: npm test

      - name: Сохранить следы упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
