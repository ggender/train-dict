name: Тесты

on:
  pull_request:
  # Те же тесты — первая ступень конвейера прода (deploy.yml).
  # Правило main переехало туда, чтобы на push тесты не шли дважды.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Поставить зависимости
        run: npm ci

      - name: Поставить браузер для e2e
        run: npx playwright install --with-deps chromium

      - name: Прогнать тесты
        run: npm test

      - name: Сохранить следы упавших тестов
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 7
