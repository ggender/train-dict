<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <title>Тренажёр слов</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app" hidden>
      <!-- 1. Зачем нужны слова -->
      <section id="screen-goal" class="screen" hidden>
        <header class="bar">
          <h1>Зачем тебе слова</h1>
        </header>

        <div class="scroll" id="thread"></div>

        <div class="dock">
          <div id="goal-ready" hidden>
            <p class="hint" id="goal-brief"></p>
            <button class="btn btn-primary" id="btn-propose">Подобрать слова</button>
          </div>
          <form id="goal-form" class="composer">
            <textarea
              id="goal-input"
              rows="1"
              enterkeyhint="send"
              placeholder="Одной фразой: зачем тебе слова?"
              autocomplete="off"
            ></textarea>
            <button class="btn btn-send" type="submit" aria-label="Отправить">→</button>
          </form>
        </div>
      </section>

      <!-- 2. Набор слов -->
      <section id="screen-proposal" class="screen" hidden>
        <header class="bar">
          <h1>Набор слов</h1>
          <p class="sub" id="proposal-sub"></p>
        </header>

        <div class="scroll" id="proposal-list"></div>

        <div class="dock">
          <button class="btn btn-primary" id="btn-confirm">Беру этот набор</button>
          <button class="btn btn-ghost" id="btn-regenerate">Подобрать другой</button>
        </div>
      </section>

      <!-- 3. Тренировка -->
      <section id="screen-study" class="screen" hidden>
        <header class="bar bar-thin">
          <span class="kind" id="card-kind"></span>
          <span class="counter">
            <span class="mark" id="card-extra" hidden>ещё раз</span>
            <span id="card-counter"></span>
          </span>
        </header>

        <div class="scroll center">
          <p class="prompt" id="card-prompt"></p>
          <div class="answer" id="card-answer" hidden>
            <p class="answer-phrase" id="answer-phrase"></p>
            <p class="answer-word"><b id="answer-word"></b><span id="answer-meaning"></span></p>
          </div>
        </div>

        <div class="dock">
          <button class="btn btn-primary" id="btn-reveal">Показать ответ</button>
          <div class="grade" id="grade-row" hidden>
            <button class="btn btn-fail" id="btn-fail">Не справился</button>
            <button class="btn btn-ok" id="btn-ok">Справился</button>
          </div>
          <button class="btn btn-ghost" id="btn-enough" hidden>Хватит</button>
        </div>
      </section>

      <!-- 4. На сегодня всё -->
      <section id="screen-done" class="screen" hidden>
        <div class="scroll center">
          <p class="done-title">На сегодня всё</p>
          <p class="done-when" id="done-when"></p>
          <p class="hint" id="done-progress"></p>
        </div>

        <!-- Пройти нечего, пока человек не прошёл ни одной карточки: тогда и полки нет -->
        <div class="dock" id="done-dock" hidden>
          <button class="btn btn-ghost" id="btn-again">Пройти слова ещё раз</button>
        </div>
      </section>
    </div>

    <div id="splash" class="screen center"><p class="hint">Загружаю…</p></div>

    <div id="toast" class="toast" hidden></div>
    <div id="busy" class="busy" hidden>
      <span class="spinner"></span>
      <p class="hint" id="busy-note"></p>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
